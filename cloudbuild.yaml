steps:
  # 1. Build Fat JAR with Maven & Node
  - name: 'maven:3.9.9-eclipse-temurin-17'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # 2. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/highmark-mcp-app:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/highmark-mcp-app:latest', '.']

  # 3. Push Container Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/highmark-mcp-app:latest']

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'highmark-mcp-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/highmark-mcp-app:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/highmark-mcp-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY

